name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GOWORK: "off"
  GOFLAGS: -mod=readonly -buildvcs=false

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Lint Go
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          golangci-lint run
          test -z "$(gofmt -l cmd api internal)"
      - name: Install Helm
        run: |
          python3 ci/install-helm.py
          echo "$GITHUB_WORKSPACE/.tools" >> "$GITHUB_PATH"
      - name: Verify generated manifests
        run: |
          make manifests generate
          ./hack/sync-helm-chart.sh
          git diff --exit-code -- api config/crd config/rbac/role.yaml charts/octelium-operator
      - name: Lint Helm chart
        run: |
          helm lint --strict charts/octelium-operator
          helm template octelium-operator charts/octelium-operator --include-crds > /dev/null

  build:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Helm
        run: |
          python3 ci/install-helm.py
          echo "$GITHUB_WORKSPACE/.tools" >> "$GITHUB_PATH"
      - name: Select artifact versions
        id: version
        run: |
          image=$(printf 'ghcr.io/%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_EVENT_NAME" = push ]; then
            chart_version=${GITHUB_REF_NAME#v}
            image_tag=$GITHUB_REF_NAME
          else
            base_version=$(helm show chart charts/octelium-operator | awk '$1 == "version:" {print $2}')
            chart_version="$base_version-dev.$GITHUB_RUN_ID"
            image_tag="dev-$GITHUB_RUN_ID"
          fi
          echo "chart=$chart_version" >> "$GITHUB_OUTPUT"
          echo "image-tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "image=$image:$image_tag" >> "$GITHUB_OUTPUT"
      - name: Build binary and installer
        env:
          OPERATOR_IMAGE: ${{ steps.version.outputs.image }}
        run: |
          make build
          make build-installer IMG="$OPERATOR_IMAGE"
      - name: Package Helm chart
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart }}
          IMAGE_TAG: ${{ steps.version.outputs.image-tag }}
        run: |
          mkdir -p dist
          helm package charts/octelium-operator --version "$CHART_VERSION" --app-version "$IMAGE_TAG" --destination dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            bin/manager
            dist/install.yaml
            dist/octelium-operator-*.tgz
          retention-days: 7
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run race tests and publication-policy checks
        run: make test-race
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  publish:
    needs: [lint, build, test]
    if: github.event_name == 'push' && (github.ref_type == 'tag' || github.ref_name == 'main' || github.ref_protected)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-packages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select image tags
        id: image
        run: echo "tags=$(sh ci/image-tags.sh)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Publish amd64 and arm64 container images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install Helm
        run: |
          python3 ci/install-helm.py
          echo "$GITHUB_WORKSPACE/.tools" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: artifacts
      - name: Publish Helm chart to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          for chart in artifacts/dist/octelium-operator-*.tgz; do
            helm push "$chart" "oci://ghcr.io/$owner/charts"
          done
