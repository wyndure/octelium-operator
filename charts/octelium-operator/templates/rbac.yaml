{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "octelium-operator.clusterRoleName" . }}
  labels:
    {{- include "octelium-operator.labels" . | nindent 4 }}
rules:
  {{- $role := .Files.Get "files/manager-role.yaml" | fromYaml }}
  {{- toYaml $role.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "octelium-operator.clusterRoleName" . }}
  labels:
    {{- include "octelium-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "octelium-operator.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "octelium-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.leaderElection.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "octelium-operator.leaderElectionName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "octelium-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "octelium-operator.leaderElectionName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "octelium-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "octelium-operator.leaderElectionName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "octelium-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
