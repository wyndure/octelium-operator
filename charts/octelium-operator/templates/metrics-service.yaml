{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "octelium-operator.metricsName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "octelium-operator.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "octelium-operator.selectorLabels" . | nindent 4 }}
{{- end }}
